services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bot}
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    profiles: ["cloud"]
    build: .
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Задайте BOT_TOKEN}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-bot}
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HEALTH_PORT: ${HEALTH_PORT:-8080}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENROUTER_MANAGEMENT_KEY: ${OPENROUTER_MANAGEMENT_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      HISTORY_MAX_MESSAGES: ${HISTORY_MAX_MESSAGES:-40}
      HISTORY_MAX_CHARS: ${HISTORY_MAX_CHARS:-8000}
      MUSIC_WEB_SEARCH: ${MUSIC_WEB_SEARCH:-true}
      DAILY_BUDGET_USD: ${DAILY_BUDGET_USD:-2}
      USER_DAILY_BUDGET_USD: ${USER_DAILY_BUDGET_USD:-0.20}
      REQUEST_RESERVE_USD: ${REQUEST_RESERVE_USD:-0.05}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-1500}
      USER_REQUESTS_PER_MINUTE: ${USER_REQUESTS_PER_MINUTE:-3}
      USER_REQUESTS_PER_DAY: ${USER_REQUESTS_PER_DAY:-50}
      HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-30}
      STATISTICS_RETENTION_DAYS: ${STATISTICS_RETENTION_DAYS:-90}
      MUSIC_PROFILE_RETENTION_DAYS: ${MUSIC_PROFILE_RETENTION_DAYS:-180}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 10s
      timeout: 20s
      retries: 6
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:

name: Deploy to VDS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          script: |
            set -e
            cd /root/tg_ai_helper
            echo "=== Pulling latest code ==="
            git pull origin main
            echo "=== Rebuilding and restarting containers ==="
            if ! docker compose --profile cloud up -d --build --wait --wait-timeout 180; then
              echo "=== Deployment failed: services did not become healthy ==="
              docker compose --profile cloud ps || true
              docker compose --profile cloud logs --tail=50 bot || true
              exit 1
            fi
            echo "=== Status ==="
            docker compose --profile cloud ps
            echo "=== MCP discovery check (read only) ==="
            if ! docker compose --profile cloud exec -T bot python -m app.mcp_probe --running; then
              echo "=== MCP session is unavailable after deployment ==="
              docker compose --profile cloud logs --tail=80 bot || true
              exit 1
            fi
            echo "=== Last logs ==="
            docker compose --profile cloud logs --tail=50 bot
